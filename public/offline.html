<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0c0d12">
  <title>Bripick | 오프라인</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("bripick-theme");
        document.documentElement.dataset.theme = saved === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <style>
    :root {
      --bg: #f6f7fb;
      --ink: #0d1020;
      --muted: #6b7287;
      --accent: #3d6bff;
      --line: #dfe3ec;
      --button: #0d1020;
      --button-ink: #ffffff;
    }
    html[data-theme="dark"] {
      --bg: #0c0d12;
      --ink: #f4f5fa;
      --muted: #8a90a3;
      --accent: #6b8cff;
      --line: #262a36;
      --button: #f4f5fa;
      --button-ink: #0d1020;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      color: var(--ink);
      background: var(--bg);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      letter-spacing: -0.02em;
      word-break: keep-all;
      text-align: center;
    }
    main { max-width: 420px; }
    .mascot { width: 88px; height: 88px; margin: 0 auto 28px; display: block; }
    .pupils { animation: look 4s ease-in-out infinite; }
    @keyframes look {
      0%, 40%, 100% { transform: translateX(0); }
      50%, 85% { transform: translateX(-18px); }
    }
    h1 { margin: 0 0 12px; font-size: 26px; font-weight: 700; line-height: 1.35; }
    p { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.6; }
    .note {
      margin-top: 24px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
    }
    button {
      margin-top: 28px;
      padding: 13px 26px;
      border: 0;
      border-radius: 999px;
      color: var(--button-ink);
      background: var(--button);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .pupils { animation: none; } }
  </style>
</head>
<body>
  <main>
    <svg class="mascot" viewBox="40 40 320 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <rect x="60" y="60" width="140" height="280" rx="70" fill="#6392FF"/>
      <rect x="60" y="200" width="280" height="140" rx="70" fill="#6392FF"/>
      <rect x="200" y="60" width="140" height="280" rx="70" fill="#6392FF"/>
      <ellipse cx="219.666" cy="233.083" rx="26.8333" ry="40.25" fill="#fff"/>
      <ellipse cx="273.333" cy="233.083" rx="26.8333" ry="40.25" fill="#fff"/>
      <g class="pupils">
        <ellipse cx="233.666" cy="231.333" rx="12.8333" ry="19.8333" fill="#0d1020"/>
        <ellipse cx="287.333" cy="231.333" rx="12.8333" ry="19.8333" fill="#0d1020"/>
      </g>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M130.248 122.013C131.531 121.883 132.72 122.757 132.957 124.047C134.436 132.095 135.733 136.183 138.16 138.746C140.54 141.259 144.399 142.698 152.409 144.033C153.717 144.251 154.615 145.448 154.483 146.749C154.615 148.05 153.718 149.247 152.409 149.465C144.399 150.8 140.54 152.24 138.16 154.752C135.733 157.315 134.436 161.404 132.957 169.451C132.72 170.742 131.531 171.615 130.248 171.485C128.965 171.615 127.777 170.742 127.539 169.451C126.06 161.404 124.764 157.315 122.336 154.752C119.957 152.24 116.097 150.8 108.087 149.465C106.779 149.247 105.881 148.05 106.013 146.749C105.881 145.448 106.779 144.251 108.087 144.033C116.097 142.698 119.957 141.259 122.336 138.746C124.764 136.183 126.06 132.095 127.539 124.047C127.777 122.757 128.965 121.883 130.248 122.013Z" fill="#395BA8"/>
    </svg>
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>연결되면 이 화면이 알아서 다시 열려요.</p>
    <p class="note">작성 중이던 이력서는 이 기기에 그대로 저장돼 있어요. 링크 게시와 로그인은 연결된 뒤에 할 수 있어요.</p>
    <button type="button" id="retry">다시 시도</button>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
